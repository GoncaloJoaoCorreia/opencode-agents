name: test

# Runs on every PR to main (and on pushes to main):
#   1. the agent-scripts unit suite (sh agent-scripts/tests/run-tests.sh)
#   2. the full validation: ./scripts/validate.sh && ./scripts/validate-driver-viz.sh
# Same commands as the manual release workflow (release.yml); setup mirrors it
# (ubuntu-latest has python3 + git preinstalled; node 22 + bun + ruby + shellcheck).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read # tests are read-only; no secrets needed

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true # cancel superseded runs on force-pushes

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run agent-scripts unit tests
        run: sh agent-scripts/tests/run-tests.sh

      - name: Install node for driver-viz tests
        uses: actions/setup-node@v5
        with:
          node-version: "22" # validate-driver-viz.sh needs >= 22.18 to strip TS types

      - name: Install bun for driver-viz render snapshot tests
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4" # OpenTUI's native render lib only loads under bun

      - name: Install validation deps
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ruby

      - name: Run full validation
        run: ./scripts/validate.sh && ./scripts/validate-driver-viz.sh
